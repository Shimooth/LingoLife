<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc"><title id="title">从第一次入住，到愿意再回来</title><desc id="desc">现有主流程｜你不扮演某个居民，而是观察他们、认识他们、适度介入。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#84998a"/></marker></defs><g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><rect x="0" y="0" width="1200" height="1030" rx="22" fill="#f7f4ec"/><text x="48" y="45" font-size="17" fill="#ae6546" font-weight="650"><tspan x="48" dy="0">LINGOLIFE  /  玩法图解 01</tspan></text><text x="48" y="101" font-size="40" fill="#29483f" font-weight="700"><tspan x="48" dy="0">从第一次入住，到愿意再回来</tspan></text><text x="48" y="146" font-size="21" fill="#63736a" font-weight="400"><tspan x="48" dy="0">现有主流程｜你不扮演某个居民，而是观察他们、认识他们、适度介入。</tspan></text><rect x="48" y="175" width="225" height="34" rx="17" fill="#e2eee5"/><text x="63" y="198" font-size="16" fill="#29483f" font-weight="600"><tspan x="63" dy="0">已有流程 · 非新功能提案</tspan></text><rect x="48" y="233" width="340" height="205" rx="22" fill="#fffdf8"/><text x="72" y="266" font-size="17" fill="#63736a" font-weight="600"><tspan x="72" dy="0">01 · 进入</tspan></text><text x="72" y="305" font-size="26" fill="#29483f" font-weight="650"><tspan x="72" dy="0">先认识这个世界</tspan></text><text x="72" y="345" font-size="21" fill="#29483f" font-weight="400"><tspan x="72" dy="0">注册或登录</tspan><tspan x="72" dy="32.550000000000004">认识观察者与管理者</tspan><tspan x="72" dy="32.550000000000004">知道这里是一群人的家</tspan></text><rect x="430" y="233" width="340" height="205" rx="22" fill="#fffdf8"/><text x="454" y="266" font-size="17" fill="#63736a" font-weight="600"><tspan x="454" dy="0">02 · 安排居民</tspan></text><text x="454" y="305" font-size="26" fill="#29483f" font-weight="650"><tspan x="454" dy="0">创造想关心的人</tspan></text><text x="454" y="345" font-size="21" fill="#29483f" font-weight="400"><tspan x="454" dy="0">随机默认两位，可自行修改</tspan><tspan x="454" dy="32.550000000000004">至少 2 人，最多 8 人</tspan><tspan x="454" dy="32.550000000000004">性格、关系、习惯有差别</tspan></text><rect x="812" y="233" width="340" height="205" rx="22" fill="#fffdf8"/><text x="836" y="266" font-size="17" fill="#63736a" font-weight="600"><tspan x="836" dy="0">03 · 一起入住</tspan></text><text x="836" y="305" font-size="26" fill="#29483f" font-weight="650"><tspan x="836" dy="0">来到共享住宅</tspan></text><text x="836" y="345" font-size="21" fill="#29483f" font-weight="400"><tspan x="836" dy="0">公共客厅、厨房和浴室</tspan><tspan x="836" dy="32.550000000000004">各自有私人卧室</tspan><tspan x="836" dy="32.550000000000004">从城市概况看大家在哪里</tspan></text><polyline points="390,335 425,335" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="772,335 807,335" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="982,440 982,505" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="812" y="510" width="340" height="205" rx="22" fill="#fffdf8"/><text x="836" y="543" font-size="17" fill="#63736a" font-weight="600"><tspan x="836" dy="0">04 · 发现</tspan></text><text x="836" y="582" font-size="26" fill="#29483f" font-weight="650"><tspan x="836" dy="0">跟随一个居民</tspan></text><text x="836" y="622" font-size="21" fill="#29483f" font-weight="400"><tspan x="836" dy="0">看他走动、做事或等待</tspan><tspan x="836" dy="32.550000000000004">进入住宅观察生活</tspan><tspan x="836" dy="32.550000000000004">发现两人之间的一件事</tspan></text><rect x="430" y="510" width="340" height="205" rx="22" fill="#fffdf8"/><text x="454" y="543" font-size="17" fill="#63736a" font-weight="600"><tspan x="454" dy="0">05 · 参与</tspan></text><text x="454" y="582" font-size="26" fill="#29483f" font-weight="650"><tspan x="454" dy="0">旁观，也可以建议</tspan></text><text x="454" y="622" font-size="21" fill="#29483f" font-weight="400"><tspan x="454" dy="0">看清谁遇到了什么问题</tspan><tspan x="454" dy="32.550000000000004">选择支持、调解或不介入</tspan><tspan x="454" dy="32.550000000000004">居民不一定听从你的建议</tspan></text><rect x="48" y="510" width="340" height="205" rx="22" fill="#fffdf8"/><text x="72" y="543" font-size="17" fill="#63736a" font-weight="600"><tspan x="72" dy="0">06 · 看见后果</tspan></text><text x="72" y="582" font-size="26" fill="#29483f" font-weight="650"><tspan x="72" dy="0">这件事留下什么</tspan></text><text x="72" y="622" font-size="21" fill="#29483f" font-weight="400"><tspan x="72" dy="0">看到回应和实际结果</tspan><tspan x="72" dy="32.550000000000004">关系、家务或记忆有变化</tspan><tspan x="72" dy="32.550000000000004">不是每件事都皆大欢喜</tspan></text><polyline points="810,612 775,612" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="428,612 393,612" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="218,718 218,773" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="48" y="780" width="1104" height="145" rx="22" fill="#e2eee5"/><text x="75" y="820" font-size="28" fill="#29483f" font-weight="650"><tspan x="75" dy="0">再次回来，不是重新开始</tspan></text><text x="75" y="860" font-size="21" fill="#29483f" font-weight="400"><tspan x="75" dy="0">看今天谁在做什么，也看之前发生的事留下了什么影响。</tspan><tspan x="75" dy="32.550000000000004">引导尚无合适故事时允许继续观察；不强制制造冲突，不保证每天送事件。</tspan></text><path d="M48 967 H1152" stroke="#d9dfd3"/><text x="48" y="999" font-size="16" fill="#63736a" font-weight="400"><tspan x="48" dy="0">设计视角 · 2026.09.09 · 中文用于说明，游戏聊天仍为英文</tspan></text><text x="1020" y="999" font-size="16" fill="#63736a" font-weight="400"><tspan x="1020" dy="0">01 / 05</tspan></text></g></svg>