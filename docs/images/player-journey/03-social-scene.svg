<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">一件小事，怎样变成有“人味”的戏</title><desc id="desc">设计示例｜以下对白与分支用于讨论体验，并非本轮已实现或实测的具体事件。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#84998a"/></marker></defs><g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><rect x="0" y="0" width="1200" height="1140" rx="22" fill="#f7f4ec"/><text x="48" y="45" font-size="17" fill="#ae6546" font-weight="650"><tspan x="48" dy="0">LINGOLIFE  /  玩法图解 03</tspan></text><text x="48" y="101" font-size="40" fill="#29483f" font-weight="700"><tspan x="48" dy="0">一件小事，怎样变成有“人味”的戏</tspan></text><text x="48" y="146" font-size="21" fill="#63736a" font-weight="400"><tspan x="48" dy="0">设计示例｜以下对白与分支用于讨论体验，并非本轮已实现或实测的具体事件。</tspan></text><rect x="48" y="175" width="210" height="34" rx="17" fill="#f4e4d1"/><text x="63" y="198" font-size="16" fill="#ae6546" font-weight="600"><tspan x="63" dy="0">建议设计 · 共餐小故事</tspan></text><rect x="48" y="233" width="525" height="160" rx="22" fill="#f4e4d1"/><text x="72" y="266" font-size="17" fill="#ae6546" font-weight="600"><tspan x="72" dy="0">角色 A · 认真，重视公平</tspan></text><text x="72" y="305" font-size="26" fill="#29483f" font-weight="650"><tspan x="72" dy="0">Aria 做好了晚饭</tspan></text><text x="72" y="345" font-size="21" fill="#29483f" font-weight="400"><tspan x="72" dy="0">她想被分担，而不只是被说一句谢谢。</tspan></text><rect x="627" y="233" width="525" height="160" rx="22" fill="#f4e4d1"/><text x="651" y="266" font-size="17" fill="#ae6546" font-weight="600"><tspan x="651" dy="0">角色 B · 随性，但今天疲惫</tspan></text><text x="651" y="305" font-size="26" fill="#29483f" font-weight="650"><tspan x="651" dy="0">Nora 想吃饭后休息</tspan></text><text x="651" y="345" font-size="21" fill="#29483f" font-weight="400"><tspan x="651" dy="0">她不是故意占便宜，也不想立刻洗碗。</tspan></text><polyline points="310,395 310,425 600,425 600,450" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="890,395 890,425 600,425" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round"/><rect x="48" y="458" width="1104" height="182" rx="22" fill="#fffdf8"/><text x="75" y="498" font-size="27" fill="#29483f" font-weight="650"><tspan x="75" dy="0">冲突要来自眼前的小事，下一句要接上一句</tspan></text><text x="75" y="543" font-size="22" fill="#29483f" font-weight="400"><tspan x="75" dy="0">Aria：“饭在锅里。今天的碗，你来？”</tspan><tspan x="75" dy="34.1">Nora：“能晚一点吗？我今天真累。”</tspan><tspan x="75" dy="34.1">Aria：“可以。但别又留到明早。”</tspan></text><polyline points="600,642 600,670 218,670 218,697" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="600,642 600,697" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="600,670 982,670 982,697" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="48" y="705" width="340" height="174" rx="22" fill="#f4e4d1"/><text x="72" y="738" font-size="17" fill="#ae6546" font-weight="600"><tspan x="72" dy="0">选择 A</tspan></text><text x="72" y="777" font-size="26" fill="#29483f" font-weight="650"><tspan x="72" dy="0">先不插手</tspan></text><text x="72" y="817" font-size="21" fill="#29483f" font-weight="400"><tspan x="72" dy="0">让两人自己谈</tspan><tspan x="72" dy="32.550000000000004">不替他们判断谁对谁错</tspan></text><rect x="430" y="705" width="340" height="174" rx="22" fill="#f4e4d1"/><text x="454" y="738" font-size="17" fill="#ae6546" font-weight="600"><tspan x="454" dy="0">选择 B</tspan></text><text x="454" y="777" font-size="26" fill="#29483f" font-weight="650"><tspan x="454" dy="0">建议晚点洗</tspan></text><text x="454" y="817" font-size="21" fill="#29483f" font-weight="400"><tspan x="454" dy="0">照顾疲劳，也承认责任</tspan><tspan x="454" dy="32.550000000000004">不是一句“别吵了”</tspan></text><rect x="812" y="705" width="340" height="174" rx="22" fill="#f4e4d1"/><text x="836" y="738" font-size="17" fill="#ae6546" font-weight="600"><tspan x="836" dy="0">选择 C</tspan></text><text x="836" y="777" font-size="26" fill="#29483f" font-weight="650"><tspan x="836" dy="0">建议分着做</tspan></text><text x="836" y="817" font-size="21" fill="#29483f" font-weight="400"><tspan x="836" dy="0">可能接受，也可能拒绝</tspan><tspan x="836" dy="32.550000000000004">玩家建议不是强制命令</tspan></text><rect x="48" y="910" width="1104" height="123" rx="22" fill="#f4e4d1"/><text x="75" y="950" font-size="27" fill="#29483f" font-weight="650"><tspan x="75" dy="0">真正的结果要落在行动上，而不只落在台词里</tspan></text><text x="75" y="991" font-size="22" fill="#29483f" font-weight="400"><tspan x="75" dy="0">可能：洗完了、拖延了、有人帮忙，或不满延续；下次互动能看出区别。</tspan></text><path d="M48 1077 H1152" stroke="#d9dfd3"/><text x="48" y="1109" font-size="16" fill="#63736a" font-weight="400"><tspan x="48" dy="0">设计视角 · 2026.09.09 · 中文用于说明，游戏聊天仍为英文</tspan></text><text x="1020" y="1109" font-size="16" fill="#63736a" font-weight="400"><tspan x="1020" dy="0">03 / 05</tspan></text></g></svg>