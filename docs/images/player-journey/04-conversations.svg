<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">从“报告状态”，变成真的在和人聊天</title><desc id="desc">左边是当前实现的限制；右边是下一步希望玩家感受到的体验。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#84998a"/></marker></defs><g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><rect x="0" y="0" width="1200" height="1050" rx="22" fill="#f7f4ec"/><text x="48" y="45" font-size="17" fill="#ae6546" font-weight="650"><tspan x="48" dy="0">LINGOLIFE  /  玩法图解 04</tspan></text><text x="48" y="101" font-size="40" fill="#29483f" font-weight="700"><tspan x="48" dy="0">从“报告状态”，变成真的在和人聊天</tspan></text><text x="48" y="146" font-size="21" fill="#63736a" font-weight="400"><tspan x="48" dy="0">左边是当前实现的限制；右边是下一步希望玩家感受到的体验。</tspan></text><rect x="48" y="179" width="250" height="34" rx="17" fill="#e2eee5"/><text x="63" y="202" font-size="16" fill="#29483f" font-weight="600"><tspan x="63" dy="0">当前：三种说话各走一套</tspan></text><rect x="627" y="179" width="245" height="34" rx="17" fill="#f4e4d1"/><text x="642" y="202" font-size="16" fill="#ae6546" font-weight="600"><tspan x="642" dy="0">建议：统一人物与情境</tspan></text><rect x="48" y="245" width="490" height="180" rx="22" fill="#fffdf8"/><text x="72" y="278" font-size="17" fill="#63736a" font-weight="600"><tspan x="72" dy="0">进入角色会话</tspan></text><text x="72" y="317" font-size="26" fill="#29483f" font-weight="650"><tspan x="72" dy="0">同一活动，常常同一句</tspan></text><text x="72" y="357" font-size="21" fill="#29483f" font-weight="400"><tspan x="72" dy="0">第一句按行动选择固定文案</tspan><tspan x="72" dy="32.550000000000004">两人都读书，就可能一模一样</tspan></text><rect x="662" y="245" width="490" height="180" rx="22" fill="#f4e4d1"/><text x="686" y="278" font-size="17" fill="#ae6546" font-weight="600"><tspan x="686" dy="0">希望获得的体验</tspan></text><text x="686" y="317" font-size="26" fill="#29483f" font-weight="650"><tspan x="686" dy="0">第一句就能认出这个人</tspan></text><text x="686" y="357" font-size="21" fill="#29483f" font-weight="400"><tspan x="686" dy="0">此刻在做什么＋对你的态度</tspan><tspan x="686" dy="32.550000000000004">带出一个具体、可以接的话题</tspan></text><polyline points="547,335 650,335" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="48" y="475" width="490" height="180" rx="22" fill="#fffdf8"/><text x="72" y="508" font-size="17" fill="#63736a" font-weight="600"><tspan x="72" dy="0">玩家继续说话</tspan></text><text x="72" y="547" font-size="26" fill="#29483f" font-weight="650"><tspan x="72" dy="0">有角色资料，但承接仍显泛</tspan></text><text x="72" y="587" font-size="21" fill="#29483f" font-weight="400"><tspan x="72" dy="0">回复会参考人物、历史与记忆</tspan><tspan x="72" dy="32.550000000000004">仍可能套话，失败会用固定回复</tspan></text><rect x="662" y="475" width="490" height="180" rx="22" fill="#f4e4d1"/><text x="686" y="508" font-size="17" fill="#ae6546" font-weight="600"><tspan x="686" dy="0">希望获得的体验</tspan></text><text x="686" y="547" font-size="26" fill="#29483f" font-weight="650"><tspan x="686" dy="0">先接你的话，再推进话题</tspan></text><text x="686" y="587" font-size="21" fill="#29483f" font-weight="400"><tspan x="686" dy="0">简短也可以，不用每句都提问</tspan><tspan x="686" dy="32.550000000000004">记住没说完的事，也允许换话题</tspan></text><polyline points="547,565 650,565" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="48" y="705" width="490" height="180" rx="22" fill="#fffdf8"/><text x="72" y="738" font-size="17" fill="#63736a" font-weight="600"><tspan x="72" dy="0">NPC 之间说话</tspan></text><text x="72" y="777" font-size="26" fill="#29483f" font-weight="650"><tspan x="72" dy="0">整段由有限台词拼出来</tspan></text><text x="72" y="817" font-size="21" fill="#29483f" font-weight="400"><tspan x="72" dy="0">常规双人场景固定五个片段</tspan><tspan x="72" dy="32.550000000000004">有口吻差异，但仍可能各说各话</tspan></text><rect x="662" y="705" width="490" height="180" rx="22" fill="#f4e4d1"/><text x="686" y="738" font-size="17" fill="#ae6546" font-weight="600"><tspan x="686" dy="0">希望获得的体验</tspan></text><text x="686" y="777" font-size="26" fill="#29483f" font-weight="650"><tspan x="686" dy="0">有立场，也有接话与留白</tspan></text><text x="686" y="817" font-size="21" fill="#29483f" font-weight="400"><tspan x="686" dy="0">朋友能打趣，生气时不强行和好</tspan><tspan x="686" dy="32.550000000000004">短戏自然收尾，长戏确有新进展</tspan></text><polyline points="547,795 650,795" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="48" y="940" font-size="22" fill="#29483f" font-weight="600"><tspan x="48" dy="0">共同底线：不捏造发生过的事，不替玩家决定，不靠聊天随意改写生活结果。</tspan></text><path d="M48 987 H1152" stroke="#d9dfd3"/><text x="48" y="1019" font-size="16" fill="#63736a" font-weight="400"><tspan x="48" dy="0">设计视角 · 2026.09.09 · 中文用于说明，游戏聊天仍为英文</tspan></text><text x="1020" y="1019" font-size="16" fill="#63736a" font-weight="400"><tspan x="1020" dy="0">04 / 05</tspan></text></g></svg>