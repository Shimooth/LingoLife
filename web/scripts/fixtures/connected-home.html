<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connected shared-home QA</title></head><body><div id="root"></div>
<script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';

import '/src/styles.css';import '/src/components/HouseholdInspector.css';

function Demo(){
 const [count,setCount]=React.useState(2),[phase,setPhase]=React.useState('living'),[model,setModel]=React.useState('city-01'),[doorState,setDoorState]=React.useState('default');

   privateRoomId:'fixture-home:private-room-'+String(slots[index]).padStart(2,'0'),
   currentAction:{source:'life',id:id+'-'+phase,type,status:'performing',locationId:drink?'fixture-home:living-room:drink':'fixture-home:'+room,

   ...['city-01','chibi'].map(value=>h('button',{key:value,'data-model':value,onClick:()=>setModel(value)},value)),
   h('button',{'data-door':'block','aria-pressed':doorState==='blocked',onClick:()=>setDoorState('blocked')},'Block kitchen door'),h('button',{'data-door':'clear','aria-pressed':doorState==='clear',onClick:()=>setDoorState('clear')},'Clear kitchen door')),

}
createRoot(document.getElementById('root')).render(h(React.StrictMode,null,h(Demo)));
