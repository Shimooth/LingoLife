<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc"><title id="title">“生活感”来自原因、行动和后果</title><desc id="desc">已有玩法骨架｜日常可以平静，只有相遇、争用或边界问题才可能成为故事。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#84998a"/></marker></defs><g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><rect x="0" y="0" width="1200" height="1030" rx="22" fill="#f7f4ec"/><text x="48" y="45" font-size="17" fill="#ae6546" font-weight="650"><tspan x="48" dy="0">LINGOLIFE  /  玩法图解 02</tspan></text><text x="48" y="101" font-size="40" fill="#29483f" font-weight="700"><tspan x="48" dy="0">“生活感”来自原因、行动和后果</tspan></text><text x="48" y="146" font-size="21" fill="#63736a" font-weight="400"><tspan x="48" dy="0">已有玩法骨架｜日常可以平静，只有相遇、争用或边界问题才可能成为故事。</tspan></text><rect x="48" y="198" width="340" height="160" rx="22" fill="#fffdf8"/><text x="72" y="231" font-size="17" fill="#63736a" font-weight="600"><tspan x="72" dy="0">原因 A</tspan></text><text x="72" y="270" font-size="26" fill="#29483f" font-weight="650"><tspan x="72" dy="0">他是怎样的人</tspan></text><text x="72" y="310" font-size="21" fill="#29483f" font-weight="400"><tspan x="72" dy="0">性格、习惯、兴趣、目标</tspan></text><rect x="430" y="198" width="340" height="160" rx="22" fill="#fffdf8"/><text x="454" y="231" font-size="17" fill="#63736a" font-weight="600"><tspan x="454" dy="0">原因 B</tspan></text><text x="454" y="270" font-size="26" fill="#29483f" font-weight="650"><tspan x="454" dy="0">他现在需要什么</tspan></text><text x="454" y="310" font-size="21" fill="#29483f" font-weight="400"><tspan x="454" dy="0">饥饿、疲劳、陪伴、独处</tspan></text><rect x="812" y="198" width="340" height="160" rx="22" fill="#fffdf8"/><text x="836" y="231" font-size="17" fill="#63736a" font-weight="600"><tspan x="836" dy="0">原因 C</tspan></text><text x="836" y="270" font-size="26" fill="#29483f" font-weight="650"><tspan x="836" dy="0">周围是什么情况</tspan></text><text x="836" y="310" font-size="21" fill="#29483f" font-weight="400"><tspan x="836" dy="0">地点、资源、别人和关系</tspan></text><polyline points="218,360 218,390 600,390" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round"/><polyline points="600,360 600,418" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="982,360 982,390 600,390" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round"/><rect x="185" y="426" width="830" height="127" rx="22" fill="#e2eee5"/><text x="218" y="469" font-size="29" fill="#29483f" font-weight="650"><tspan x="218" dy="0">决定去做一件事</tspan></text><text x="218" y="510" font-size="22" fill="#29483f" font-weight="400"><tspan x="218" dy="0">前往地点 → 做事；遇到占用 → 等待、协商或换计划</tspan></text><polyline points="600,555 600,584 218,584 218,608" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="600,555 600,608" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="600,584 982,584 982,608" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="48" y="616" width="340" height="164" rx="22" fill="#fffdf8"/><text x="72" y="649" font-size="17" fill="#63736a" font-weight="600"><tspan x="72" dy="0">可能 A · 平静日常</tspan></text><text x="72" y="688" font-size="26" fill="#29483f" font-weight="650"><tspan x="72" dy="0">一个人也在生活</tspan></text><text x="72" y="728" font-size="21" fill="#29483f" font-weight="400"><tspan x="72" dy="0">读书、休息、吃饭、洗澡</tspan><tspan x="72" dy="32.550000000000004">不需要每次都出现事件</tspan></text><rect x="430" y="616" width="340" height="164" rx="22" fill="#fffdf8"/><text x="454" y="649" font-size="17" fill="#63736a" font-weight="600"><tspan x="454" dy="0">可能 B · 联系</tspan></text><text x="454" y="688" font-size="26" fill="#29483f" font-weight="650"><tspan x="454" dy="0">和别人一起做事</tspan></text><text x="454" y="728" font-size="21" fill="#29483f" font-weight="400"><tspan x="454" dy="0">分享食物、聊天、陪伴</tspan><tspan x="454" dy="32.550000000000004">亲近来自具体共同经历</tspan></text><rect x="812" y="616" width="340" height="164" rx="22" fill="#fffdf8"/><text x="836" y="649" font-size="17" fill="#63736a" font-weight="600"><tspan x="836" dy="0">可能 C · 摩擦</tspan></text><text x="836" y="688" font-size="26" fill="#29483f" font-weight="650"><tspan x="836" dy="0">彼此的需要冲突</tspan></text><text x="836" y="728" font-size="21" fill="#29483f" font-weight="400"><tspan x="836" dy="0">争用厨房、借物、家务</tspan><tspan x="836" dy="32.550000000000004">玩家可旁观或有限介入</tspan></text><polyline points="218,782 218,804 600,804" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round"/><polyline points="600,782 600,828" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="982,782 982,804 600,804" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round"/><rect x="48" y="836" width="1104" height="91" rx="22" fill="#e2eee5"/><text x="75" y="872" font-size="27" fill="#29483f" font-weight="650"><tspan x="75" dy="0">事情结束 → 人与家庭留下变化 → 影响下一次选择</tspan></text><text x="75" y="908" font-size="21" fill="#29483f" font-weight="400"><tspan x="75" dy="0">不必次次加好感：也可以保留分歧、拒绝、和解或新的期待。</tspan></text><polyline points="48,881 24,881 24,489 177,489" fill="none" stroke="#84998a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M48 967 H1152" stroke="#d9dfd3"/><text x="48" y="999" font-size="16" fill="#63736a" font-weight="400"><tspan x="48" dy="0">设计视角 · 2026.09.09 · 中文用于说明，游戏聊天仍为英文</tspan></text><text x="1020" y="999" font-size="16" fill="#63736a" font-weight="400"><tspan x="1020" dy="0">02 / 05</tspan></text></g></svg>